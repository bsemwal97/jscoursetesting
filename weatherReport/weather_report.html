<!DOCTYPE html>
<html>
<head>
  <title>Weather Report</title>
</head>
<body>
  <h1>Weather Report</h1>

  <form id="weatherForm">
    <label for="latitude">Enter Latitude:</label>
    <input
      type="number"
      id="latitude"
      min="-90"
      max="90"
      step="any"
      required
    >

    <label for="longitude">Enter Longitude:</label>
    <input
      type="number"
      id="longitude"
      min="-180"
      max="180"
      step="any"
      required
    >

    <button type="submit">Get Weather</button>
  </form>

  <div id="weatherInfo"></div>

  <script src="./weather_report.js"></script>
</body>
</html>
